name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: node pruebas/todo.js   # sintaxis de cada <script>, las cinco pruebas y la de navegador (Chrome viene en ubuntu-latest)
