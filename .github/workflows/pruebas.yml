name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: node pruebas/correr.js
      - run: node pruebas/unidad.js
      - run: node pruebas/casos.js
      - run: node pruebas/presentacion.js
      - run: node pruebas/idavuelta.js
